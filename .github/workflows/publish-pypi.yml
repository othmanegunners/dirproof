name: Publish to PyPI

# One-time PyPI pending publisher: project dirproof-cli, owner othmanegunners,
# repo dirproof, workflow publish-pypi.yml, environment pypi.
# Upload is deliberately manual; not triggered by pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tooling
        run: python -m pip install --upgrade build twine .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-for-pypi
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dirproof-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-for-pypi
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
